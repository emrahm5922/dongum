# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m

# AndroidX package structure
android.useAndroidX=true

# Keep this true because your project path contains non-ASCII characters ("ı")
android.overridePathCheck=true

# Modern Android Defaults
android.nonTransitiveRClass=true
android.enableJetifier=false

# Note: Deprecated properties like 'android.newDsl', 'android.builtInKotlin', etc. 
# have been removed as they are no longer needed in modern AGP versions.
