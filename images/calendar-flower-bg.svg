<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <!-- 3D Petal Linear Gradient -->
    <linearGradient id="flowerPetalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE4EC" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#F8BBD0" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#F48FB1" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="flowerCenterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F48FB1" stop-opacity="0.6"/>
    </linearGradient>

    <!-- 3D Soft Shadow & Depth Filter -->
    <filter id="flower3dDepth" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#D4556B" flood-opacity="0.15"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="3" specularConstant="0.6" specularExponent="15" result="specular">
        <fePointLight x="100" y="80" z="200"/>
      </feSpecularLighting>
      <feComposite in="SourceGraphic" in2="specular" operator="over"/>
    </filter>
  </defs>

  <!-- Pastel Pink Silk Background -->
  <rect width="100%" height="100%" fill="#FDF0F3"/>

  <!-- Large Blooming 3D Flower on Left Side -->
  <g transform="translate(20, 240)" filter="url(#flower3dDepth)">
    <ellipse cx="0" cy="0" rx="34" ry="110" fill="url(#flowerPetalGrad)" transform="rotate(0)"/>
    <ellipse cx="0" cy="0" rx="34" ry="110" fill="url(#flowerPetalGrad)" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="34" ry="110" fill="url(#flowerPetalGrad)" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="34" ry="110" fill="url(#flowerPetalGrad)" transform="rotate(90)"/>
    <ellipse cx="0" cy="0" rx="34" ry="110" fill="url(#flowerPetalGrad)" transform="rotate(120)"/>
    <ellipse cx="0" cy="0" rx="34" ry="110" fill="url(#flowerPetalGrad)" transform="rotate(150)"/>
    <circle cx="0" cy="0" r="42" fill="url(#flowerCenterGrad)"/>
    <circle cx="0" cy="0" r="28" fill="#FFF0F5" opacity="0.8"/>
  </g>

  <!-- Large Blooming 3D Flower on Bottom-Right Side -->
  <g transform="translate(460, 520)" filter="url(#flower3dDepth)">
    <ellipse cx="0" cy="0" rx="38" ry="125" fill="url(#flowerPetalGrad)" transform="rotate(15)"/>
    <ellipse cx="0" cy="0" rx="38" ry="125" fill="url(#flowerPetalGrad)" transform="rotate(45)"/>
    <ellipse cx="0" cy="0" rx="38" ry="125" fill="url(#flowerPetalGrad)" transform="rotate(75)"/>
    <ellipse cx="0" cy="0" rx="38" ry="125" fill="url(#flowerPetalGrad)" transform="rotate(105)"/>
    <ellipse cx="0" cy="0" rx="38" ry="125" fill="url(#flowerPetalGrad)" transform="rotate(135)"/>
    <ellipse cx="0" cy="0" rx="38" ry="125" fill="url(#flowerPetalGrad)" transform="rotate(165)"/>
    <circle cx="0" cy="0" r="46" fill="url(#flowerCenterGrad)"/>
    <circle cx="0" cy="0" r="30" fill="#FFF0F5" opacity="0.8"/>
  </g>

  <!-- Delicate Petals on Top-Right -->
  <g transform="translate(480, 40)" filter="url(#flower3dDepth)" opacity="0.6">
    <ellipse cx="0" cy="0" rx="26" ry="80" fill="url(#flowerPetalGrad)" transform="rotate(20)"/>
    <ellipse cx="0" cy="0" rx="26" ry="80" fill="url(#flowerPetalGrad)" transform="rotate(80)"/>
    <ellipse cx="0" cy="0" rx="26" ry="80" fill="url(#flowerPetalGrad)" transform="rotate(140)"/>
  </g>
</svg>
