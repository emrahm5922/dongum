<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 800" width="100%" height="100%">
  <!-- Sakura Cherry Blossom 3D Theme -->
  <defs>
    <linearGradient id="sakuraBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCE4EC"/>
      <stop offset="100%" stop-color="#F8BBD0"/>
    </linearGradient>
    <linearGradient id="petalPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F48FB1" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#sakuraBg)"/>

  <!-- Left Branch & Sakura Flowers -->
  <g transform="translate(-20, 260)" opacity="0.6">
    <ellipse cx="60" cy="0" rx="35" ry="120" fill="url(#petalPink)" transform="rotate(10 60 0)"/>
    <ellipse cx="60" cy="0" rx="35" ry="120" fill="url(#petalPink)" transform="rotate(45 60 0)"/>
    <ellipse cx="60" cy="0" rx="35" ry="120" fill="url(#petalPink)" transform="rotate(80 60 0)"/>
    <ellipse cx="60" cy="0" rx="35" ry="120" fill="url(#petalPink)" transform="rotate(115 60 0)"/>
    <ellipse cx="60" cy="0" rx="35" ry="120" fill="url(#petalPink)" transform="rotate(150 60 0)"/>
    <circle cx="60" cy="0" r="30" fill="#FFEBEE"/>
  </g>

  <!-- Bottom Right Sakura -->
  <g transform="translate(460, 580)" opacity="0.6">
    <ellipse cx="0" cy="0" rx="40" ry="130" fill="url(#petalPink)" transform="rotate(20)"/>
    <ellipse cx="0" cy="0" rx="40" ry="130" fill="url(#petalPink)" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="40" ry="130" fill="url(#petalPink)" transform="rotate(100)"/>
    <ellipse cx="0" cy="0" rx="40" ry="130" fill="url(#petalPink)" transform="rotate(140)"/>
    <circle cx="0" cy="0" r="36" fill="#FFEBEE"/>
  </g>
</svg>
